# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Game
minecraft_version=1.21.11

# Loader
enabled_platforms=fabric,neoforge
fabric_loader_version=0.19.3
fabric_api_version=0.141.6+1.21.11
neoforge_version=21.11.45

# Mod
maven_group=net.rpg_foundation
archives_name=ranged_weapon_api
mod_version=4.0.0.001
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=1.21.11     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=1.21.11

# Optional Dependencies
# EMI has no 1.21.11 build yet: the plugin stays in-tree but is excluded from compilation and the classpath
# until `enable_emi=true` (and emi_version points at a 1.21.11 artifact).
enable_emi=false
emi_version=1.1.15+1.21.1
