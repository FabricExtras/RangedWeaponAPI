# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Game
minecraft_version=26.3

# Loader
enabled_platforms=fabric,neoforge
fabric_loader_version=0.19.5
fabric_api_version=0.160.6+26.3
neoforge_version=26.3.0.3-beta

# Mod
maven_group=net.rpg_foundation
archives_name=ranged_weapon_api
mod_version=4.0.0
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Optional Dependencies
# EMI has no 26.x build yet: the plugin stays in-tree but is excluded from compilation and the classpath
# until `enable_emi=true` (and emi_version points at a 26.1 artifact).
enable_emi=false
emi_version=1.1.15+1.21.1
